<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090807"><meta name="description" content="HAYA Family Restaurant digital menu. Browse our food menu and contact us."><title>HAYA Family Restaurant | Digital Menu</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090807;color:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2d170a 0,#090807 64%);min-height:100vh}header{position:sticky;top:0;z-index:5;background:#0b0907f5;border-bottom:1px solid #a97a2e;padding:8px max(12px,calc((100vw - 1200px)/2));box-shadow:0 3px 16px #000a}.head{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand{display:flex;gap:11px;align-items:center;min-width:0;flex:1}.brand img{width:55px;height:55px;object-fit:contain}.brand strong{font-size:clamp(15px,2.6vw,23px);color:#f8d17d;letter-spacing:.03em;line-height:1.12}.brand small{display:block;color:#cbb893;font-size:11px;margin-top:4px}.contacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}a.contact{padding:9px 12px;text-decoration:none;color:#fff;border:1px solid #bc8735;border-radius:999px;font-weight:650;font-size:13px;white-space:nowrap}a.whatsapp{border-color:#2d9a66;color:#b5ffcc}main{max-width:1150px;margin:auto;padding:14px 12px 32px}.toolbar{display:flex;gap:8px;align-items:center;margin:10px auto;max-width:1050px;justify-content:space-between;flex-wrap:wrap}.toolbar button,.chip{background:#201509;border:1px solid #956b2a;color:#ffe2a2;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:650}.toolbar button:hover,.chip:hover{background:#493111}.categories{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 11px;scrollbar-width:thin}.chip{flex-shrink:0;font-size:12px}figure{margin:0 auto;max-width:1050px;position:relative;min-height:100px;background:#050404;display:grid;place-items:center;border:1px solid #513818;border-radius:12px;overflow:hidden;touch-action:pan-y}figure img{display:block;width:100%;height:auto;max-height:calc(100dvh - 208px);object-fit:contain;user-select:none}figure.zoom img{max-height:none;width:180%;cursor:zoom-out}figure.zoom{overflow:auto;display:block}figcaption{position:absolute;bottom:8px;right:10px;background:#090807d8;padding:4px 9px;border-radius:8px;font-size:12px}.nav{position:absolute;top:46%;background:#070605d9;border:1px solid #e6bc60;border-radius:50%;width:42px;height:42px;color:white;font-size:24px;cursor:pointer}.nav.prev{left:8px}.nav.next{right:8px}.nav:disabled{opacity:.3;cursor:default}.zoom .nav{display:none}footer{text-align:center;color:#a99d83;font-size:12px;padding:16px}@media(max-width:700px){.head{flex-wrap:wrap}.brand img{width:43px;height:43px}.contacts{width:100%;justify-content:center}a.contact{font-size:12px;padding:7px 11px}main{padding:8px 6px}figure img{max-height:calc(100dvh - 240px)}.toolbar button{padding:8px 10px}}
</style></head><body><header><div class="head"><div class="brand"><img src="logo.png" alt="HAYA Family Restaurant logo"><div><strong>HAYA FAMILY RESTAURANT</strong><small>Your satisfaction is our recipe</small></div></div><nav class="contacts" aria-label="Contact"><a class="contact" href="tel:+94372048888">☎ Call 037 204 88 88</a><a class="contact whatsapp" href="https://wa.me/94784550550" target="_blank" rel="noopener noreferrer">◉ WhatsApp 0784 550 550</a></nav></div></header><main><div class="categories" aria-label="Menu categories"><button type="button" data-page="1" class="chip">Welcome</button><button type="button" data-page="2" class="chip">All Categories</button><button type="button" data-page="3" class="chip">Starters</button><button type="button" data-page="17" class="chip">Crispy Chicken</button><button type="button" data-page="20" class="chip">Kids’ Favourites</button><button type="button" data-page="24" class="chip">Rice Specials</button><button type="button" data-page="55" class="chip">Fried Noodles</button><button type="button" data-page="61" class="chip">Pasta</button><button type="button" data-page="66" class="chip">Kottu Specials</button></div><section class="toolbar"><button id="home" type="button">⌂ Home</button><button id="menu" type="button">☷ Categories</button><span id="counter" aria-live="polite">Page 1 of 226</span><button id="zoom" type="button">⊕ Zoom</button></section><figure id="viewer"><img id="page" src="images/page-001.webp" alt="HAYA menu page 1"><button class="nav prev" id="previous" aria-label="Previous page">‹</button><button class="nav next" id="next" aria-label="Next page">›</button><figcaption id="caption">1 / 226</figcaption></figure><footer>HAYA Family Restaurant · Original menu artwork preserved</footer></main><script>
const COUNT=226;let current=1;const viewer=document.getElementById('viewer'),img=document.getElementById('page');function go(n){current=Math.min(COUNT,Math.max(1,n));img.src=`images/page-${String(current).padStart(3,'0')}.webp`;img.alt=`HAYA Family Restaurant original menu artwork, page ${current}`;document.getElementById('counter').textContent=`Page ${current} of ${COUNT}`;document.getElementById('caption').textContent=`${current} / ${COUNT}`;document.getElementById('previous').disabled=current===1;document.getElementById('next').disabled=current===COUNT;viewer.classList.remove('zoom');location.hash=`page-${current}`;const next=new Image();if(current<COUNT)next.src=`images/page-${String(current+1).padStart(3,'0')}.webp`;}document.getElementById('previous').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('home').onclick=()=>go(1);document.getElementById('menu').onclick=()=>go(2);document.getElementById('zoom').onclick=()=>viewer.classList.toggle('zoom');document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>go(+el.dataset.page));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Escape')viewer.classList.remove('zoom')});let start=null;viewer.addEventListener('touchstart',e=>{if(viewer.classList.contains('zoom'))return;start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});viewer.addEventListener('touchend',e=>{if(!start||viewer.classList.contains('zoom'))return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1));start=null},{passive:true});const hash=Number((location.hash.match(/page-(\d+)/)||[])[1]);go(hash||1);
</script></body></html>
